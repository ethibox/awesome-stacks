# DOMAIN=example.com ADMIN_PASSWORD=myp@ssw0rd docker stack deploy -c changedetection.yml changedetection

services:
  app:
    image: dgtlmoon/changedetection.io:${VERSION:-0.70.4}
    command:
      - python
      - -c
      - |
        import base64, hashlib, os
        salt = os.urandom(32)
        key = hashlib.pbkdf2_hmac('sha256', os.environ['ADMIN_PASSWORD'].encode(), salt, 100000)
        os.environ['SALTED_PASS'] = base64.b64encode(salt + key).decode()
        os.execlp('python', 'python', './changedetection.py', '-d', '/datastore')
    environment:
      - WEBDRIVER_URL=http://chrome:4444/wd/hub
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
    volumes:
      - ${VOLUME_PATH}data:/datastore
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.changedetection-${NUMBER:-1}.rule=Host(`${DOMAIN:-changedetection.localhost}`)
        - traefik.http.services.changedetection-${NUMBER:-1}.loadbalancer.server.port=5000
    networks:
      - internal
      - traefik

  chrome:
    image: selenium/standalone-chrome:4.52.0
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - internal

volumes:
  data:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
