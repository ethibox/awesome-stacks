# DOMAIN=example.com ADMIN_PASSWORD=myp@ssw0rd APIKEY=$(openssl rand -hex 32) SECRET=$(openssl rand -hex 32) docker stack deploy -c serpbear.yml serpbear

services:
  web:
    image: towfiqi/serpbear:${VERSION:-2.0.7}
    volumes:
      - ${VOLUME_PATH}data:/app/data
    environment:
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN:-serpbear.localhost}
      - USER=${ADMIN_USERNAME:-admin}
      - PASSWORD=${ADMIN_PASSWORD:?}
      - SECRET=${SECRET:?}
      - APIKEY=${APIKEY:?}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.serpbear-${NUMBER:-1}.rule=Host(`${DOMAIN:-serpbear.localhost}`)
        - traefik.http.services.serpbear-${NUMBER:-1}.loadbalancer.server.port=3000

volumes:
  data:

networks:
  default:
    external: true
    name: traefik-net
