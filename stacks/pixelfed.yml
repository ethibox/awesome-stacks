# DOMAIN=example.com docker stack deploy -c pixelfed.yml pixelfed

services:
  init:
    image: &pixelfed-image ethibox/pixelfed:${VERSION:-v0.15.2}
    user: root
    entrypoint: /bin/sh -c
    command:
      - |
        cp -r --update=none /var/www/html/storage/. /data
        chown -R 33:33 /data
    volumes:
      - ${VOLUME_PATH}data:/data
    deploy:
      restart_policy:
        condition: on-failure

  app:
    image: *pixelfed-image
    command:
      - /bin/sh
      - -c
      - |
        php artisan user:create --name="$$ADMIN_USERNAME" --username="$$ADMIN_USERNAME" --email="$$ADMIN_EMAIL" --password="$$ADMIN_PASSWORD" --is_admin=true --confirm_email=1 || true
        exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
    environment: &pixelfed-environment
      - APP_NAME=${APP_NAME:-PixelFed}
      - APP_KEY=${APP_KEY:-S0meR@nd0mStringS0meR@nd0mString}
      - APP_URL=https://${DOMAIN:-pixelfed.localhost}
      - APP_DOMAIN=${DOMAIN:-pixelfed.localhost}
      - TRUST_PROXIES=*

      - AUTORUN_ENABLED=true

      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-myp@ssw0rd}

      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_DATABASE=pixelfed
      - DB_USERNAME=pixelfed
      - DB_PASSWORD=myp@ssw0rd

      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_DRIVER=redis
      - REDIS_HOST=redis

      - MAIL_DRIVER=${MAIL_DRIVER:-log}
      - MAIL_HOST=${MAIL_HOST:-smtp.example.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-username}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-password}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-admin@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-"My name"}

      - OPEN_REGISTRATION=${OPEN_REGISTRATION:-true}
      - ENFORCE_EMAIL_VERIFICATION=${ENFORCE_EMAIL_VERIFICATION:-false}

      - MAX_CAPTION_LENGTH=150
      - HORIZON_DARKMODE=true

      - ACTIVITY_PUB=${ACTIVITY_PUB:-false}
      - AP_REMOTE_FOLLOW=${REMOTE_FOLLOW:-false}
    healthcheck:
      start_period: 5m
    volumes:
      - ${VOLUME_PATH}data:/var/www/html/storage
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.pixelfed-${NUMBER:-1}.rule=Host(`${DOMAIN:-pixelfed.localhost}`)
        - traefik.http.services.pixelfed-${NUMBER:-1}.loadbalancer.server.port=8080
    networks:
      - traefik
      - internal

  worker:
    image: *pixelfed-image
    environment: *pixelfed-environment
    entrypoint: php /var/www/html/artisan horizon
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s
    volumes:
      - ${VOLUME_PATH}data:/var/www/html/storage
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    volumes:
      - ${VOLUME_PATH}mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=myp@ssw0rd
      - MYSQL_DATABASE=pixelfed
      - MYSQL_USER=pixelfed
      - MYSQL_PASSWORD=myp@ssw0rd
      - MARIADB_AUTO_UPGRADE=1
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    volumes:
      - ${VOLUME_PATH}redis:/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  data:
  redis:
  mariadb:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
