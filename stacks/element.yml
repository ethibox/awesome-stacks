# DOMAIN=example.com docker stack deploy -c element.yml element
# docker exec -it $(docker ps -qf 'name=element_synapse\.') register_new_matrix_user -c /data/homeserver.yaml http://localhost:8008
# https://matrix.org/federationtester # To check config

services:
  web:
    image: vectorim/element-web:${VERSION:-v1.12.33}
    user: root
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/.well-known/matrix
        echo '{"m.server": "'$$DOMAIN':443"}' > /app/.well-known/matrix/server
        echo '{"m.homeserver":{"base_url":"https://'$$DOMAIN'"},"m.identity_server":{"base_url":"https://vector.im"}}' > /app/.well-known/matrix/client
        sed -i -e 's/"breadcrumbs": true/"breadcrumbs": true,\n        "language": "'$$LANGUAGE'"/g' /app/config.json
        sed -i "s#https://matrix-client.matrix.org#https://$$DOMAIN#g; s/matrix.org/$$DOMAIN/g" /app/config.json
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      - LANGUAGE=${LANGUAGE:-fr_FR}
      - DOMAIN=${DOMAIN:-element.localhost}
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.element-${NUMBER:-1}.rule=Host(`${DOMAIN:-element.localhost}`)
        - traefik.http.services.element-${NUMBER:-1}.loadbalancer.server.port=80
    networks:
      - traefik
      - internal

  synapse:
    image: ghcr.io/element-hq/synapse:${SYNAPSE_VERSION:-v1.164.2}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        /start.py generate
        sed -i -e '/^[^#]*log_config:/s/^/#/' /data/homeserver.yaml
        echo "enable_registration: $$ENABLE_REGISTRATION" > /data/env.yaml
        echo "enable_registration_without_verification: $$DISABLE_VERIFICATION" >> /data/env.yaml
        [ -n "$$AUTO_JOIN_ROOM" ] && echo "auto_join_rooms: [\"$$AUTO_JOIN_ROOM\"]" >> /data/env.yaml
        exec /start.py run -c /data/homeserver.yaml -c /data/env.yaml
    environment:
      - AUTO_JOIN_ROOM=${AUTO_JOIN_ROOM}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-true}
      - DISABLE_VERIFICATION=${DISABLE_VERIFICATION:-true}
      - SYNAPSE_SERVER_NAME=${DOMAIN:-element.localhost}
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - ${VOLUME_PATH}synapse:/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.element-synapse-${NUMBER:-1}.rule=Host(`${DOMAIN:-element.localhost}`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse`))
        - traefik.http.services.element-synapse-${NUMBER:-1}.loadbalancer.server.port=8008
    networks:
      - traefik
      - internal

  synapse-admin:
    image: ghcr.io/etkecc/ketesa:${SYNAPSE_ADMIN_VERSION:-v1.5.2-subpath-admin}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo '{ "restrictBaseUrl": "https://'"$$DOMAIN"'" }' > /var/public/admin/config.json
        exec /usr/local/bin/entrypoint.sh static-web-server
    environment:
      - DOMAIN=${DOMAIN:-element.localhost}
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.element-synapse-admin-${NUMBER:-1}.rule=Host(`${DOMAIN:-element.localhost}`) && PathPrefix(`/admin`)
        - traefik.http.services.element-synapse-admin-${NUMBER:-1}.loadbalancer.server.port=8080
    networks:
      - traefik
      - internal

volumes:
  synapse:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
