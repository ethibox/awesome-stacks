# DOMAIN=example.com docker stack deploy -c wikijs.yml wikijs

services:
  web:
    image: requarks/wiki:${VERSION:-3.1.0}
    environment:
      - DB_HOST=postgres
      - DB_USER=wikijs
      - DB_NAME=wikijs
      - DB_PASS=myp@ssw0rd
      - ADMIN_PASS=${ADMIN_PASSWORD:-myp@ssw0rd}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.wikijs-${NUMBER:-1}.rule=Host(`${DOMAIN:-wikijs.localhost}`)
        - traefik.http.services.wikijs-${NUMBER:-1}.loadbalancer.server.port=3000
    networks:
      - internal
      - traefik

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-17-alpine}
    environment:
      - POSTGRES_DB=wikijs
      - POSTGRES_USER=wikijs
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wikijs"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
