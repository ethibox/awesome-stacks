# DOMAIN=example.com ADMIN_SECRET=mys3cr3t docker stack deploy -c hasura.yml hasura

services:
  graphql-engine:
    image: hasura/graphql-engine:${VERSION:-v2.0.6}
    environment:
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
      - HASURA_GRAPHQL_ADMIN_SECRET=${ADMIN_SECRET:?}
      - HASURA_GRAPHQL_DATABASE_URL=postgres://hasura@postgres:5432/hasura?password=${POSTGRES_PASSWORD:-myp@ssw0rd}
      - HASURA_GRAPHQL_ENABLED_LOG_TYPES=startup, http-log, webhook-log, websocket-log, query-log
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.hasura-${NUMBER:-1}.rule=Host(`${DOMAIN:-hasura.localhost}`)
        - traefik.http.services.hasura-${NUMBER:-1}.loadbalancer.server.port=8080
    networks:
      - internal
      - traefik

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=hasura
      - POSTGRES_USER=hasura
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
