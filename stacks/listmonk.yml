# DOMAIN=example.com docker stack deploy -c listmonk.yml listmonk

services:
  app:
    image: listmonk/listmonk:${VERSION:-v6.2.0}
    command:
      - /bin/sh
      - -c
      - |
        rm config.toml
        ./listmonk --new-config
        ./listmonk --install --idempotent --yes
        ./listmonk --upgrade --yes
        ./listmonk
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_db__host=postgres
      - LISTMONK_db__password=myp@ssw0rd
      - LISTMONK_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - LISTMONK_ADMIN_PASSWORD=${ADMIN_PASSWORD:-myp@ssw0rd}
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=myp@ssw0rd
      - DB_HOST=postgres
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.listmonk-${NUMBER:-1}.rule=Host(`${DOMAIN:-listmonk.localhost}`)
        - traefik.http.services.listmonk-${NUMBER:-1}.loadbalancer.server.port=9000
    networks:
      - internal
      - traefik

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "listmonk"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
