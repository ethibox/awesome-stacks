# DOMAIN=example.com docker stack deploy -c etherpad.yml etherpad

services:
  init:
    image: busybox
    command: chown -R 5001:5001 /opt/etherpad-lite/src/plugin_packages /opt/etherpad-lite/var /opt/etherpad-lite/src/static/images
    user: root
    volumes:
      - ${VOLUME_PATH}plugins:/opt/etherpad-lite/src/plugin_packages
      - ${VOLUME_PATH}images:/opt/etherpad-lite/src/static/images
      - ${VOLUME_PATH}var:/opt/etherpad-lite/var
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: ${IMAGE:-etherpad/etherpad}:${VERSION:-3.3.7}
    volumes:
      - ${VOLUME_PATH}plugins:/opt/etherpad-lite/src/plugin_packages
      - ${VOLUME_PATH}images:/opt/etherpad-lite/src/static/images
      - ${VOLUME_PATH}var:/opt/etherpad-lite/var
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_NAME=etherpad
      - DB_USER=etherpad
      - DB_PASS=myp@ssw0rd
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-myp@ssw0rd}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - EP__ep_image_upload__storage__type=local
      - EP__ep_image_upload__storage__baseFolder=/opt/etherpad-lite/src/static/images
      - EP__ep_image_upload__storage__baseURL=https://${DOMAIN:-etherpad.localhost}/static/images/
      - EP__ep_image_upload__maxFileSize=5000000
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.etherpad-${NUMBER:-1}.rule=Host(`${DOMAIN:-etherpad.localhost}`)
        - traefik.http.services.etherpad-${NUMBER:-1}.loadbalancer.server.port=9001
    networks:
      - traefik
      - internal

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=etherpad
      - POSTGRES_USER=etherpad
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etherpad"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  var:
  plugins:
  images:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
