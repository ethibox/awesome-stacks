# DOMAIN=example.com docker stack deploy -c searxng.yml searxng

services:
  web:
    image: searxng/searxng:${VERSION:-latest}
    environment:
      - BIND_ADDRESS=0.0.0.0:8080
      - BASE_URL=https://${DOMAIN:-searxng.localhost}
      - SEARXNG_PUBLIC_INSTANCE=${SEARXNG_PUBLIC_INSTANCE:-false}
      - SEARXNG_VALKEY_URL=${SEARXNG_VALKEY_URL:-redis://redis:6379/0}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.searxng-${NUMBER:-1}.rule=Host(`${DOMAIN:-searxng.localhost}`)
        - traefik.http.routers.searxng-${NUMBER:-1}.middlewares=searxng-${NUMBER:-1}-security
        - traefik.http.services.searxng-${NUMBER:-1}.loadbalancer.server.port=8080
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.STSSeconds=63072000
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.STSIncludeSubdomains=true
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.STSPreload=true
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.ForceSTSHeader=true
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.FrameDeny=true
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.ContentTypeNosniff=true
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.ReferrerPolicy=no-referrer
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.ContentSecurityPolicy=upgrade-insecure-requests; default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self' https:; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; connect-src 'self'; img-src * data:; frame-src https:;
        - traefik.http.middlewares.searxng-${NUMBER:-1}-security.headers.CustomResponseHeaders.Permissions-Policy=geolocation=(), microphone=(), camera=()
    networks:
      - internal
      - traefik

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
