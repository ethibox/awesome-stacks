# DOMAIN=example.com docker stack deploy -c invidious.yml invidious

services:
  web:
    image: quay.io/invidious/invidious:${VERSION:-master}
    environment:
      INVIDIOUS_CONFIG: |
        hmac_key: ${HMAC_KEY:-random_hmac_key} # pwgen 20 1
        domain: ${DOMAIN:-invidious.localhost}
        https_only: ${HTTPS_ONLY:-true}
        check_tables: true
        db:
          host: postgres
          dbname: invidious
          user: invidious
          password: myp@ssw0rd
          port: 5432
        invidious_companion:
          - private_url: http://companion:8282/companion
        invidious_companion_key: ${COMPANION_KEY:-randomcompanionk} # pwgen 16 1
        default_user_preferences:
          default_home: Trending
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.invidious-${NUMBER:-1}.rule=Host(`${DOMAIN:-invidious.localhost}`)
        - traefik.http.services.invidious-${NUMBER:-1}.loadbalancer.server.port=3000
    networks:
      - internal
      - traefik

  companion:
    image: quay.io/invidious/invidious-companion:${COMPANION_VERSION:-latest}
    environment:
      - SERVER_SECRET_KEY=${COMPANION_KEY:-randomcompanionk}
      - PROXY=${PROXY:-}
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ${VOLUME_PATH}companion:/var/tmp/youtubei.js
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=invidious
      - POSTGRES_USER=invidious
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "invidious"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres:
  companion:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
