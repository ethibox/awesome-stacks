# DOMAIN=example.com docker stack deploy -c freescout.yml freescout

services:
  web:
    image: nfrastack/freescout:${VERSION:-2.2.21}
    volumes:
      - ${VOLUME_PATH}data:/data
      - ${VOLUME_PATH}logs:/logs
    environment:
      - VIRTUAL_HOST=${DOMAIN:-freescout.localhost}
      - VIRTUAL_PORT=80
      - DB_HOST=mariadb
      - DB_NAME=freescout
      - DB_USER=freescout
      - DB_PASS=myp@ssw0rd
      - APP_URL=https://${DOMAIN:-freescout.localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASS=${ADMIN_PASSWORD:-myp@ssw0rd}
      - ENABLE_SSL_PROXY=${ENABLE_SSL_PROXY:-true}
      - FREESCOUT_APP_DEBUG=${DISPLAY_ERRORS:-false}
      - FREESCOUT_APP_TIMEZONE=Europe/Paris
      - TIMEZONE=Europe/Paris
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.freescout-${NUMBER:-1}.rule=Host(`${DOMAIN:-freescout.localhost}`)
        - traefik.http.services.freescout-${NUMBER:-1}.loadbalancer.server.port=80
    networks:
      - internal
      - traefik

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    volumes:
      - ${VOLUME_PATH}mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-myp@ssw0rd}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-freescout}
      - MYSQL_USER=${MYSQL_USER:-freescout}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-myp@ssw0rd}
      - MARIADB_AUTO_UPGRADE=1
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  mariadb:
  data:
  logs:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
