# DOMAIN=example.com docker stack deploy -c actualbudget.yml actualbudget

services:
  web:
    image: actualbudget/actual-server:${VERSION:-26.11.0}
    volumes:
      - ${VOLUME_PATH}data:/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.actualbudget-${NUMBER:-1}.rule=Host(`${DOMAIN:-actualbudget.localhost}`)
        - traefik.http.services.actualbudget-${NUMBER:-1}.loadbalancer.server.port=5006

volumes:
  data:

networks:
  default:
    external: true
    name: traefik-net
