# DOMAIN=example.com docker stack deploy -c monitoring.yml monitoring

services:
  init:
    image: busybox
    command: sh -c "chown -R 472 /grafana && chown -R nobody /prometheus /config"
    volumes:
      - ${VOLUME_PATH}config:/config
      - ${VOLUME_PATH}grafana:/grafana
      - ${VOLUME_PATH}prometheus:/prometheus
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.14}
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-noreply@example.com}
      - GF_SMTP_HOST=${SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-myp@ssw0rd}
      - GF_SMTP_USER=${SMTP_USERNAME:-noreply@example.com}
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-grafana.localhost}
    volumes:
      - ${VOLUME_PATH}grafana:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana-${NUMBER:-1}.rule=Host(`${DOMAIN:-grafana.localhost}`)
        - traefik.http.services.grafana-${NUMBER:-1}.loadbalancer.server.port=3000
        - traefik.http.routers.grafana-${NUMBER:-1}.middlewares=grafana-${NUMBER:-1}-ip
        - traefik.http.middlewares.grafana-${NUMBER:-1}-ip.ipallowlist.sourcerange=${ALLOWED_IPS:-0.0.0.0/0,::/0}
    networks:
      - internal
      - traefik

  prometheus:
    image: prom/prometheus:v3.16.0
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /etc/prometheus/prometheus.yml ]; then
        cat << EOF > /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 30s

        scrape_configs:
          - job_name: prometheus
            metrics_path: /prometheus/metrics
            static_configs:
              - targets: ['localhost:9090']

          - job_name: node-exporter
            dns_sd_configs:
            - names:
              - tasks.node-exporter
              type: A
              port: 9100

          - job_name: cadvisor
            dns_sd_configs:
            - names:
              - tasks.cadvisor
              type: A
              port: 8080

          - job_name: process-exporter
            dns_sd_configs:
            - names:
              - tasks.process-exporter
              type: A
              port: 9256
        EOF
        fi

        [ -f /etc/prometheus/process-conf.yml ] || cat << EOF > /etc/prometheus/process-conf.yml
        process_names:
          - name: "{{.Comm}}"
            cmdline:
            - '.+'
        EOF

        prometheus --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/prometheus \
        --storage.tsdb.retention.time=7d \
        --storage.tsdb.retention.size=20GB \
        --web.route-prefix=/prometheus
    volumes:
      - ${VOLUME_PATH}prometheus:/prometheus
      - ${VOLUME_PATH}config:/etc/prometheus/
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          memory: ${MEMORY_RESERVATION:-4G}
    networks:
      - internal

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command: -docker_only=true -housekeeping_interval=15s -disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,advtcp,hugetlb,referenced_memory
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      mode: global
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:v1.12.1
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /:/rootfs:ro,rslave
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
    command:
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--path.procfs=/host/proc'
      - '--collector.filesystem.mount-points-exclude=^/(dev|etc|proc|run/credentials/.+|sys|var/lib/docker/.+)($$|/)'
      - '--no-collector.ipvs'
    deploy:
      mode: global
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-128M}
        reservations:
          memory: ${MEMORY_RESERVATION:-64M}
    networks:
      - internal

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    command: --procfs /host/proc --config.path /etc/process-exporter/process-conf.yml
    volumes:
      - /proc:/host/proc:ro
      - ${VOLUME_PATH}config:/etc/process-exporter:ro
    deploy:
      mode: global
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  config:
  grafana:
  prometheus:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
