# DOMAIN=example.com ADMIN_EMAIL=admin@example.com ADMIN_PASSWORD=myp@ssw0rd docker stack deploy -c openwebui.yml -c ollama.yml ollama

services:
  ollama:
    image: ollama/ollama:${VERSION:-0.40.15}
    volumes:
      - ${VOLUME_PATH}ollama:/root/.ollama
    networks:
      - internal

  openwebui:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - default
      - internal

volumes:
  ollama:

networks:
  internal:
    driver: overlay
    attachable: true
