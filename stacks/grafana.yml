# DOMAIN=example.com ADMIN_PASSWORD=myp@ssw0rd docker stack deploy -c grafana.yml grafana

services:
  grafana:
    image: grafana/grafana:${VERSION:-13.3.0}
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
    volumes:
      - ${VOLUME_PATH}grafana:/var/lib/grafana
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana-${NUMBER:-1}.rule=Host(`${DOMAIN:-grafana.localhost}`)
        - traefik.http.services.grafana-${NUMBER:-1}.loadbalancer.server.port=3000

volumes:
  grafana:

networks:
  default:
    external: true
    name: traefik-net
