# DOMAIN=example.com APP_SECRET_KEY=$(openssl rand -hex 32) ENCRYPTION_KEY=$(openssl rand -hex 32) WEBHOOK_SECRET_KEY=$(openssl rand -hex 32) docker stack deploy -c automatisch.yml automatisch

services:
  web:
    image: automatischio/automatisch:${VERSION:-0.15.0}
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=automatisch
      - POSTGRES_USERNAME=automatisch
      - POSTGRES_PASSWORD=myp@ssw0rd
      - PROTOCOL=https
      - HOST=${DOMAIN:-automatisch.localhost}
      - API_URL=https://${DOMAIN:-automatisch.localhost}
      - WEB_APP_URL=https://${DOMAIN:-automatisch.localhost}
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:?}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
    volumes:
      - ${VOLUME_PATH}storage:/automatisch/storage
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.automatisch-${NUMBER:-1}.rule=Host(`${DOMAIN:-automatisch.localhost}`)
        - traefik.http.services.automatisch-${NUMBER:-1}.loadbalancer.server.port=3000
    networks:
      - internal
      - traefik

  redis:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - ${VOLUME_PATH}redis:/data
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=automatisch
      - POSTGRES_USER=automatisch
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "automatisch"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  redis:
  storage:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
