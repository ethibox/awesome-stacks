# DOMAIN=example.com ADMIN_PASSWORD=myp@ssw0rd docker stack deploy -c akaunting.yml akaunting

services:
  app:
    image: akaunting/akaunting:${VERSION:-3.3.2-v}
    entrypoint: ['sh', '-c', 'grep -qs APP_INSTALLED=true .env || export AKAUNTING_SETUP=true; exec akaunting-v.sh --start']
    environment:
      - APP_URL=https://${DOMAIN:-akaunting.localhost}
      - LOCALE=${LOCALE:-en-US}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=akaunting
      - DB_USERNAME=akaunting
      - DB_PASSWORD=${MYSQL_PASSWORD:-myp@ssw0rd}
      - DB_PREFIX=ak_
      - COMPANY_NAME=${COMPANY_NAME:-My Company}
      - COMPANY_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
    volumes:
      - ${VOLUME_PATH}data:/var/www/html
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.akaunting-${NUMBER:-1}.rule=Host(`${DOMAIN:-akaunting.localhost}`)
        - traefik.http.services.akaunting-${NUMBER:-1}.loadbalancer.server.port=80
    networks:
      - internal
      - traefik

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    volumes:
      - ${VOLUME_PATH}mariadb:/var/lib/mysql
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_USER=${MYSQL_USER:-akaunting}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-akaunting}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-myp@ssw0rd}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-myp@ssw0rd}
    networks:
      - internal

volumes:
  data:
  mariadb:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
