# env DOMAIN=example.com SECRET_KEY_BASE=$(openssl rand -hex 32) OTP_SECRET=$(openssl rand -hex 32) ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16) ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16) ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16) $(docker run --rm ghcr.io/mastodon/mastodon bundle exec rake mastodon:webpush:generate_vapid_key) docker stack deploy -c mastodon.yml mastodon
# tootctl accounts create <username> --email <email> --confirmed --role Owner

services:
  init:
    image: busybox:latest
    command: chown -R 991:991 /mastodon/public/system
    volumes:
      - ${VOLUME_PATH}system:/mastodon/public/system
    deploy:
      restart_policy:
        condition: on-failure

  web:
    image: &image ghcr.io/mastodon/mastodon:${VERSION:-v4.7.6}
    environment: &environment
      - LOCAL_DOMAIN=${DOMAIN:-mastodon.localhost}
      - SINGLE_USER_MODE=${SINGLE_USER_MODE:-false}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?}
      - OTP_SECRET=${OTP_SECRET}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - DB_HOST=${POSTGRES_HOST:-postgres}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${POSTGRES_DB:-mastodon}
      - DB_USER=${POSTGRES_USER:-mastodon}
      - DB_PASS=${POSTGRES_PASSWORD:-myp@ssw0rd}
      - REDIS_HOST=redis
      - SMTP_SERVER=${SMTP_SERVER:-smtp.mailgun.org}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_LOGIN=${SMTP_LOGIN}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTH_METHOD=${SMTP_AUTH_METHOD:-plain}
      - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE:-none}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-noreply@example.com}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?}
    command: bash -c "rails db:migrate && bundle exec puma -C config/puma.rb"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off localhost:3000/health || exit 1"]
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.mastodon-${NUMBER:-1}.rule=Host(`${DOMAIN:-mastodon.localhost}`)
        - traefik.http.services.mastodon-${NUMBER:-1}.loadbalancer.server.port=3000
    volumes:
      - ${VOLUME_PATH}system:/mastodon/public/system
    networks:
      - traefik
      - internal

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:${VERSION:-v4.7.6}
    environment: *environment
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off localhost:4000/api/v1/streaming/health || exit 1"]
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.mastodon-streaming-${NUMBER:-1}.rule=Host(`${DOMAIN:-mastodon.localhost}`) && PathPrefix(`/api/v1/streaming`)
        - traefik.http.services.mastodon-streaming-${NUMBER:-1}.loadbalancer.server.port=4000
    networks:
      - traefik
      - internal

  sidekiq:
    image: *image
    environment: *environment
    command: bundle exec sidekiq
    volumes:
      - ${VOLUME_PATH}system:/mastodon/public/system
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-14-alpine}
    command: postgres -c 'max_connections=250'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mastodon}
      - POSTGRES_USER=${POSTGRES_USER:-mastodon}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - ${VOLUME_PATH}redis:/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  system:
  redis:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
