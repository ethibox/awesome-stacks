# DOMAIN=example.com SECRET_KEY_BASE=$(openssl rand -hex 32) docker stack deploy -c writebook.yml writebook
# chown -R 1000:1000 storage/

services:
  web:
    image: ethibox/writebook:${VERSION:-latest}
    volumes:
      - ${VOLUME_PATH}storage:/rails/storage
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.writebook-${NUMBER:-1}.rule=Host(`${DOMAIN:-writebook.localhost}`)
        - traefik.http.services.writebook-${NUMBER:-1}.loadbalancer.server.port=80

volumes:
  storage:

networks:
  default:
    external: true
    name: traefik-net
