# DOMAIN=example.com ADMIN_PASSWORD=$(openssl rand -hex 16) docker stack deploy -c discourse.yml discourse

services:
  app:
    image: discourse/discourse:${VERSION:-2026.7.6}
    command:
      - /bin/bash
      - -ec
      - |
        rm -f /etc/runit/1.d/install-ssl
        cd /var/www/discourse
        su discourse -c 'bundle exec rake db:migrate'
        su discourse -c 'bundle exec rails runner -' <<'RUBY'
          email = ENV["DISCOURSE_DEVELOPER_EMAILS"]
          exit if User.find_by_email(email)
          admin = User.create!(username: "admin", email: email, password: ENV["ADMIN_PASSWORD"])
          admin.grant_admin!
          admin.activate
        RUBY
        exec /sbin/boot
    volumes:
      - ${VOLUME_PATH}data:/shared
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
      - DISCOURSE_DB_HOST=postgres
      - DISCOURSE_DB_NAME=discourse
      - DISCOURSE_DB_USERNAME=discourse
      - DISCOURSE_DB_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
      - DISCOURSE_REDIS_HOST=redis
      - DISCOURSE_SMTP_PORT=${SMTP_PORT:-587}
      - DISCOURSE_SMTP_USER_NAME=${SMTP_USER}
      - DISCOURSE_SMTP_PASSWORD=${SMTP_PASSWORD}
      - DISCOURSE_SMTP_ENABLE_START_TLS=${SMTP_TLS:-true}
      - DISCOURSE_SMTP_ADDRESS=${SMTP_HOST:-smtp.example.com}
      - DISCOURSE_DEVELOPER_EMAILS=${ADMIN_EMAIL:-admin@example.com}
      - DISCOURSE_NOTIFICATION_EMAIL=${SMTP_FROM:-noreply@example.com}
      - DISCOURSE_HOSTNAME=${DOMAIN:-discourse.localhost}
      - DISCOURSE_FORCE_HTTPS=${FORCE_HTTPS:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fL http://localhost/srv/status || exit 1"]
      start_period: 1m
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.discourse-${NUMBER:-1}.rule=Host(`${DOMAIN:-discourse.localhost}`)
        - traefik.http.services.discourse-${NUMBER:-1}.loadbalancer.server.port=80
    networks:
      - traefik
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-discourse/postgres}:${POSTGRES_VERSION:-pg16}
    environment:
      - POSTGRES_DB=discourse
      - POSTGRES_USER=discourse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "discourse"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  data:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
