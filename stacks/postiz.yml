# DOMAIN=example.com docker stack deploy -c postiz.yml postiz

services:
  web:
    image: ghcr.io/gitroomhq/postiz-app:${VERSION:-v2.25.3}
    environment:
      - MAIN_URL=https://${DOMAIN:-postiz.localhost}
      - FRONTEND_URL=https://${DOMAIN:-postiz.localhost}
      - NEXT_PUBLIC_BACKEND_URL=https://${DOMAIN:-postiz.localhost}/api
      - JWT_SECRET=${JWT_SECRET:-mys3cr3t}
      - DATABASE_URL=postgresql://postiz:myp@ssw0rd@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - IS_GENERAL=true
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
      - X_API_KEY=${X_API_KEY}
      - X_API_SECRET=${X_API_SECRET}
      - X_CLIENT=${X_CLIENT}
      - X_SECRET=${X_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').catch(() => process.exit(1))"]
    volumes:
      - ${VOLUME_PATH}config:/config/
      - ${VOLUME_PATH}uploads:/uploads/
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.postiz-${NUMBER:-1}.rule=Host(`${DOMAIN:-postiz.localhost}`)
        - traefik.http.services.postiz-${NUMBER:-1}.loadbalancer.server.port=5000
    networks:
      - internal
      - traefik

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.7}
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postiz
      - POSTGRES_PWD=myp@ssw0rd
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v8
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-8.19.23}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - ${VOLUME_PATH}elasticsearch:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - ${VOLUME_PATH}redis:/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal
 
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=postiz
      - POSTGRES_USER=postiz
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postiz"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  redis:
  config:
  uploads:
  postgres:
  elasticsearch:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
