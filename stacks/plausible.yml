# DOMAIN=example.com SECRET_KEY_BASE=$(openssl rand -base64 48) docker stack deploy -c plausible.yml plausible

services:
  plausible:
    image: ghcr.io/plausible/community-edition:${VERSION:-v3.2.1}
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      - BASE_URL=https://${DOMAIN:-plausible.localhost}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?} # openssl rand -base64 48
      - DATABASE_URL=postgres://plausible:myp%40ssw0rd@postgres:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://clickhouse:8123/plausible
      - MAILER_EMAIL=${SMTP_FROM:-plausible@example.com}
      - SMTP_HOST_ADDR=${SMTP_HOST}
      - SMTP_HOST_PORT=${SMTP_PORT:-587}
      - SMTP_USER_NAME=${SMTP_USERNAME}
      - SMTP_USER_PWD=${SMTP_PASSWORD}
      - SMTP_HOST_SSL_ENABLED=${SMTP_SSL:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/api/health"]
    volumes:
      - ${VOLUME_PATH}plausible:/var/lib/plausible
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.plausible-${NUMBER:-1}.rule=Host(`${DOMAIN:-plausible.localhost}`)
        - traefik.http.services.plausible-${NUMBER:-1}.loadbalancer.server.port=8000
    networks:
      - internal
      - traefik

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.12-alpine}
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ${VOLUME_PATH}clickhouse:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=plausible
      - POSTGRES_USER=plausible
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  clickhouse:
  plausible:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
