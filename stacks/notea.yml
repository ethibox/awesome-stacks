# DOMAIN=example.com PASSWORD=myp@ssw0rd STORE_ACCESS_KEY=myaccesskey STORE_SECRET_KEY=mys3cr3tkey docker stack deploy -c notea.yml notea

services:
  web:
    image: cinwell/notea:${VERSION:-0.3.6}
    environment:
      - STORE_ACCESS_KEY=${STORE_ACCESS_KEY:?}
      - STORE_SECRET_KEY=${STORE_SECRET_KEY:?}
      - STORE_BUCKET=${STORE_BUCKET:-notea}
      - STORE_END_POINT=${STORE_END_POINT:-http://play.minio.io}
      - STORE_FORCE_PATH_STYLE=true
      - PASSWORD=${PASSWORD:?}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.notea-${NUMBER:-1}.rule=Host(`${DOMAIN:-notea.localhost}`)
        - traefik.http.services.notea-${NUMBER:-1}.loadbalancer.server.port=3000

networks:
  default:
    external: true
    name: traefik-net
