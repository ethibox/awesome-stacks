# DOMAIN=example.com docker stack deploy -c ethercalc.yml ethercalc

services:
  web:
    image: audreyt/ethercalc:${VERSION:-0.20261101.3}
    environment:
      - REDIS_PORT_6379_TCP_ADDR=redis
      - REDIS_PORT_6379_TCP_PORT=6379
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.ethercalc-${NUMBER:-1}.rule=Host(`${DOMAIN:-ethercalc.localhost}`)
        - traefik.http.services.ethercalc-${NUMBER:-1}.loadbalancer.server.port=8000

  redis:
    image: redis:${REDIS_VERSION:-8-alpine}
    volumes:
      - ${VOLUME_PATH}redis:/data
    networks:
      - internal

volumes:
  redis:

networks:
  internal:
    driver: overlay
    attachable: true
  default:
    external: true
    name: traefik-net
