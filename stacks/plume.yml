# DOMAIN=example.com ADMIN_PASSWORD=myp@ssw0rd ROCKET_SECRET_KEY=$(openssl rand -base64 32) docker stack deploy -c plume.yml plume

services:
  server:
    image: plumeorg/plume:${VERSION:-0.7.2}
    command:
      - /bin/sh
      - -c
      - |
        plm migration run
        plm search init
        plm instance new -d $$BASE_URL -n $$INSTANCE_NAME
        plm users new -n 'admin' -N 'admin' -b 'Administrateur' -e $$ADMIN_EMAIL -p $$ADMIN_PASSWORD --admin
        plume
    environment:
      - BASE_URL=${DOMAIN:-plume.localhost}
      - DATABASE_URL=postgres://plume:myp%40ssw0rd@postgres:5432/plume
      - ROCKET_ADDRESS=0.0.0.0
      - MAIL_SERVER=${MAIL_SERVER:-example.org}
      - ROCKET_SECRET_KEY=${ROCKET_SECRET_KEY:?}
      - INSTANCE_NAME=${INSTANCE_NAME:-Plume}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@domain.name}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
    volumes:
      - ${VOLUME_PATH}media:/app/static/media
      - ${VOLUME_PATH}search_index:/app/search_index
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.plume-${NUMBER:-1}.rule=Host(`${DOMAIN:-plume.localhost}`)
        - traefik.http.services.plume-${NUMBER:-1}.loadbalancer.server.port=7878
    networks:
      - internal
      - traefik

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=plume
      - POSTGRES_USER=plume
      - POSTGRES_PASSWORD=myp@ssw0rd
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  search_index:
  postgres:
  media:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
