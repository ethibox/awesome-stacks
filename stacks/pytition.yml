# DOMAIN=example.com docker stack deploy -c pytition.yml pytition
# pdm run python pytition/manage.py createsuperuser # Create first admin user

services:
  app:
    image: ethibox/pytition:${VERSION:-2.9}
    command:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > pytition/pytition/settings/__init__.py
        from .base import *
        DEBUG = False
        SECRET_KEY = '${SECRET_KEY:-mys3cr3t}' # openssl rand -hex 32
        ALLOWED_HOSTS = ['${DOMAIN:-pytition.localhost}']
        CSRF_TRUSTED_ORIGINS = ['https://${DOMAIN:-pytition.localhost}']
        STATIC_ROOT = '/static'
        MEDIA_ROOT = '/mediaroot'
        DATABASES = {'default': {'ENGINE': 'django.db.backends.postgresql', 'HOST': 'postgres', 'NAME': 'pytition', 'USER': 'pytition', 'PASSWORD': 'myp@ssw0rd'}}
        EMAIL_HOST = '${SMTP_HOST:-smtp.example.com}'
        EMAIL_PORT = ${SMTP_PORT:-587}
        EMAIL_HOST_USER = '${SMTP_USER:-}'
        EMAIL_HOST_PASSWORD = '${SMTP_PASSWORD:-}'
        EMAIL_USE_TLS = ${SMTP_TLS:-True}
        DEFAULT_FROM_EMAIL = '${SMTP_FROM:-noreply@example.com}'
        ALLOW_REGISTER = ${ALLOW_REGISTER:-True}
        EOF
        until pdm run python pytition/manage.py migrate; do sleep 1; done
        pdm run python pytition/manage.py collectstatic --noinput
        pdm run python pytition/manage.py compilemessages
        exec pdm run uwsgi --http :8000 --chdir pytition --module pytition.wsgi --static-map /static=/static --static-map /mediaroot=/mediaroot
    volumes:
      - ${VOLUME_PATH}media:/mediaroot
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.pytition-${NUMBER:-1}.rule=Host(`${DOMAIN:-pytition.localhost}`)
        - traefik.http.services.pytition-${NUMBER:-1}.loadbalancer.server.port=8000
    networks:
      - internal
      - traefik

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=pytition
      - POSTGRES_USER=pytition
      - POSTGRES_PASSWORD=myp@ssw0rd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pytition"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  media:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
