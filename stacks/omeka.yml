# DOMAIN=example.com docker stack deploy -c omeka.yml omeka

services:
  init:
    image: busybox
    command: chown -R 33:33 /var/www/html/files /var/www/html/config /var/www/html/modules
    volumes:
      - ${VOLUME_PATH}files:/var/www/html/files
      - ${VOLUME_PATH}config:/var/www/html/config
      - ${VOLUME_PATH}modules:/var/www/html/modules
    deploy:
      restart_policy:
        condition: on-failure

  omeka:
    image: ethibox/omeka:${VERSION:-4.3.0-alpha}
    volumes:
      - ${VOLUME_PATH}files:/var/www/html/files
      - ${VOLUME_PATH}config:/var/www/html/config
      - ${VOLUME_PATH}modules:/var/www/html/modules
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mariadb}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-myp@ssw0rd}
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.omeka-${NUMBER:-1}.rule=Host(`${DOMAIN:-omeka.localhost}`)
        - traefik.http.services.omeka-${NUMBER:-1}.loadbalancer.server.port=80
    networks:
      - internal
      - traefik

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    volumes:
      - ${VOLUME_PATH}mariadb:/var/lib/mysql
    environment:
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-myp@ssw0rd}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-myp@ssw0rd}
      - MARIADB_AUTO_UPGRADE=1
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  files:
  config:
  modules:
  mariadb:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
