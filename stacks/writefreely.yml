# DOMAIN=example.com docker stack deploy -c writefreely.yml writefreely

services:
  web:
    image: ${IMAGE:-ethibox/writefreely}:${VERSION:-0.17.2}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        cat > /go/config.ini <<EOF
        [server]
        port = 8080
        bind = 0.0.0.0

        [database]
        type     = mysql
        username = writefreely
        password = myp@ssw0rd
        database = writefreely
        host     = mariadb
        port     = 3306

        [app]
        site_name         = ${APP_TITLE:-Writefreely}
        host              = https://${DOMAIN:-writefreely.localhost}
        theme             = ${APP_THEME:-write}
        webfonts          = ${APP_WEBFONT:-true}
        open_registration = ${APP_OPENREGISTRATION:-true}
        federation        = ${APP_FEDERATION:-true}
        EOF

        if [ "${DISABLE_ROBOTS:-false}" = "true" ]; then
          printf 'User-agent: *\nDisallow: /\n' > /go/static/robots.txt
        fi

        cmd/writefreely/writefreely --init-db
        cmd/writefreely/writefreely --gen-keys
        cmd/writefreely/writefreely
    volumes:
      - ${VOLUME_PATH}keys:/go/keys
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
      labels:
        - traefik.enable=true
        - traefik.http.routers.writefreely-${NUMBER:-1}.rule=Host(`${DOMAIN:-writefreely.localhost}`)
        - traefik.http.services.writefreely-${NUMBER:-1}.loadbalancer.server.port=8080
    networks:
      - internal
      - traefik

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    volumes:
      - ${VOLUME_PATH}mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=myp@ssw0rd
      - MYSQL_DATABASE=writefreely
      - MYSQL_PASSWORD=myp@ssw0rd
      - MYSQL_USER=writefreely
      - MARIADB_AUTO_UPGRADE=1
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}
    networks:
      - internal

volumes:
  mariadb:
  keys:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
