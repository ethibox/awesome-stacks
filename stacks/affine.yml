# DOMAIN=example.com docker stack deploy -c affine.yml affine

services:
  affine:
    image: &image ghcr.io/toeverything/affine:${VERSION:-0.27.4}
    volumes: &volumes
      - ${VOLUME_PATH}storage:/root/.affine/storage
      - ${VOLUME_PATH}config:/root/.affine/config
    environment: &environment
      - REDIS_SERVER_HOST=redis
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_HOST=${DOMAIN:-affine.localhost}
      - AFFINE_SERVER_EXTERNAL_URL=https://${DOMAIN:-affine.localhost}
      - DATABASE_URL=postgresql://affine:${POSTGRES_PASSWORD:-myp@ssw0rd}@postgres:5432/affine
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.affine-${NUMBER:-1}.rule=Host(`${DOMAIN:-affine.localhost}`)
        - traefik.http.services.affine-${NUMBER:-1}.loadbalancer.server.port=3010
    networks:
      - internal
      - traefik

  migration:
    image: *image
    volumes: *volumes
    environment: *environment
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - internal

  redis:
    image: redis:${REDIS_VERSION:-8-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    environment:
      - POSTGRES_DB=affine
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myp@ssw0rd}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine"]
    volumes:
      - ${VOLUME_PATH}postgres:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  config:
  storage:
  postgres:

networks:
  internal:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-net
