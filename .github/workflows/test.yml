name: Test

on:
  push:
    branches: [master]
    paths: ['stacks/*.yml']
  pull_request:
    paths: ['stacks/*.yml']
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: list
        working-directory: stacks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only --relative --diff-filter=AMR $BASE HEAD -- '*.yml')
          else
            files=$(ls *.yml)
          fi
          echo "files=$(jq -nc '$ARGS.positional' --args $files)" >> $GITHUB_OUTPUT

  deploy:
    needs: changes
    if: needs.changes.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.files) }}
    defaults:
      run:
        working-directory: stacks
    steps:
      - uses: actions/checkout@v5

      - run: |
          sudo sysctl -w vm.max_map_count=262144 # needed by Elasticsearch
          docker swarm init
          docker network create -d overlay traefik-net
          docker stack deploy -c traefik.yml traefik

      - run: eval "$(head -1 ${{ matrix.file }} | sed 's/^# //')"

      - timeout-minutes: 15
        run: |
          grep -q traefik.enable=true ${{ matrix.file }} || exit 0
          while curl -s -k -o /dev/null -w '%{http_code}' --resolve example.com:443:127.0.0.1 https://example.com |
            grep -qE '000|404|5..'; do sleep 10; done

      - if: failure()
        run: |
          docker node ps --no-trunc
          for service in $(docker service ls -q); do docker service logs --tail 20 $service; done
