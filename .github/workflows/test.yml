name: Test

on:
  push:
    branches: [master]
    paths: ['stacks/*.yml']
  pull_request:
    paths: ['stacks/*.yml']

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.filter.outputs.stacks_files }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            stacks:
              - added|modified: 'stacks/*.yml'

  deploy:
    needs: changes
    if: needs.changes.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.files) }}
    defaults:
      run:
        working-directory: stacks
    steps:
      - uses: actions/checkout@v5

      - name: Start Swarm and Traefik
        run: |
          sudo sysctl -w vm.max_map_count=262144 # needed by Elasticsearch
          docker swarm init
          docker network create -d overlay traefik-net
          docker stack deploy -c traefik.yml traefik

      - name: Deploy stack
        run: eval "$(head -1 ../${{ matrix.file }} | sed 's/^# //')"

      - name: Check app answers
        run: |
          grep -q traefik.enable=true ../${{ matrix.file }} || exit 0
          curl -f -s -k -o /dev/null --retry 60 --retry-delay 10 --retry-all-errors --resolve example.com:443:127.0.0.1 https://example.com
